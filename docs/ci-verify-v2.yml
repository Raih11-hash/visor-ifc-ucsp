name: Verificar visor v2
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci --include=dev --ignore-scripts --no-fund
      - run: npm run sync:engine
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_v2.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidencia-visor-v2
          path: test-results/
          retention-days: 7
